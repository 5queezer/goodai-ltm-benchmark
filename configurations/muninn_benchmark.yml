config:
  debug: True
  run_name: "MuninnDB Benchmark - 1k"
  incompatibilities:
    - - "names"
      - "name_list"
    - - "locations"
      - "locations_directions"

datasets:
    args:
      memory_span: 1000
      dataset_examples: 3

    datasets:
      - name: "colours"
        args:
          colour_changes: 3

      - name: "shopping"
        args:
          item_changes: 6

      - name: "locations_directions"
        args:
          known_locations: 6

      - name: "name_list"
        args:
          name_changes: 5

      - name: "trigger_response"

      - name: "spy_meeting"
